name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-agnostic:
    name: No PayStream in backend/app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The agent must work on any repo, so the demo target's name never appears in app code.
      - name: Fail if backend/app mentions PayStream
        run: |
          if grep -rniI "paystream" backend/app; then
            echo "::error::backend/app must stay repo-agnostic. Remove the PayStream references listed above."
            exit 1
          fi

  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: roottrace
          POSTGRES_PASSWORD: roottrace
          POSTGRES_DB: roottrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roottrace -d roottrace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://roottrace:roottrace@localhost:5432/roottrace
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: backend

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

      # The frontend's types are generated from this file, so a route or model change must
      # regenerate it (`npm run gen:api`) in the same PR.
      - name: Check frontend/openapi.json is current
        run: |
          uv run python scripts/export_openapi.py ../frontend/openapi.json
          if ! git diff --exit-code -- ../frontend/openapi.json; then
            echo "::error::frontend/openapi.json is out of date. Run 'npm run gen:api' in frontend/ and commit the result."
            exit 1
          fi

  frontend:
    name: Frontend (eslint, vitest, tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check src/api/schema.ts matches openapi.json
        run: |
          npm run gen:types
          if ! git diff --exit-code -- src/api/schema.ts; then
            echo "::error::src/api/schema.ts is out of date. Run 'npm run gen:api' and commit the result."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type-check and build
        run: npm run build
