[project]
name = "roottrace-backend"
version = "0.1.0"
description = "RootTrace AI backend: FastAPI API, LangGraph agent, RAG, tools and MCP servers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "contree-cli>=0.9.4",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "langgraph>=1.2.16",
    "openai>=3.31.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "sqlglot>=30.24.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations hold long SQL strings (CHECK and generated-column expressions).
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
# backend/alembic/ (our migrations folder) would otherwise make ruff treat alembic as first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
