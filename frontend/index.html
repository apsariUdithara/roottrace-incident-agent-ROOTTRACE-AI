<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>RootTrace AI</title>
    <script>
      // Light by default; dark only if chosen with the top bar's toggle (src/lib/theme.ts).
      // Runs before the page draws, so it never flashes the wrong theme.
      try {
        if (localStorage.getItem('roottrace.theme') === 'dark') document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
